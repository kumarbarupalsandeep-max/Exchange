<main class="wrap"><section class="form-shell panel"><span class="eyebrow">Get started</span><h1>Create account</h1><p class="muted">Create a demo profile layout.</p><div class="notice">Registration is not connected to a backend. No account will be created.</div><form data-demo-form="auth"><div class="field"><label for="name">Full name</label><input id="name" placeholder="Your name" required autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="name@example.com" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password"></div><label><input type="checkbox" required> I agree to the demo terms and risk notice.</label><p style="margin-top:18px"><button class="wide" type="submit">Create Account</button></p><p class="success"></p></form><p class="muted">Already registered? <a href="login.html" style="color:var(--yellow)">Log in</a></p></section></main><footer class="footer"><span>© 2026 Exchange. Independent demo interface.</span><div class="footer-links"><a href="markets.html">Markets</a><a href="support.html">Help Center</a><a href="about.html">About</a><a href="login.html">Log In</a></div></footer><script src="js/pages.js"></script></body></html>
