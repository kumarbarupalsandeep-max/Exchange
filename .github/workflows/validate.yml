name: Frontend static validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static project checks
        run: node scripts/validate-project.mjs
      - name: Check feature JavaScript syntax
        run: node --check js/platform.js
